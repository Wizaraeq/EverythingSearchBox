name: Build EverythingSearchBox without icon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Patch SearchBoxToolbarControl.cs
        shell: pwsh
        run: |
          @'
          using System;
          using System.Drawing;
          using System.Windows.Forms;

          namespace QuizoPlugins
          {
              internal sealed class SearchBoxToolbarControl : UserControl
              {
                  private readonly CustomFilterBox searchBox;

                  public SearchBoxToolbarControl(
                      string placeholderText,
                      Image iconImage,
                      bool fLarge)
                  {
                      searchBox = new CustomFilterBox(placeholderText)
                      {
                          Left = 2
                      };

                      Width = searchBox.Right + 2;
                      Height = searchBox.Height + 2;

                      searchBox.Top =
                          (Height - searchBox.Height) / 2;

                      Controls.Add(searchBox);

                      searchBox.KeyDown += SearchBox_KeyDown;
                  }

                  public event EventHandler<string> QuerySubmitted;

                  public bool IsLargeLayout => false;

                  public void UpdatePlaceholderText(
                      string placeholderText)
                  {
                      searchBox.UpdatePlaceholderText(
                          placeholderText);
                  }

                  public void UpdateIcon(Image iconImage)
                  {
                      // Intentionally disabled.
                      // The toolbar contains only the search box.
                  }

                  protected override void Dispose(bool disposing)
                  {
                      if (disposing)
                      {
                          searchBox.KeyDown -= SearchBox_KeyDown;
                      }

                      base.Dispose(disposing);
                  }

                  private void SearchBox_KeyDown(
                      object sender,
                      KeyEventArgs e)
                  {
                      if (e.KeyCode != Keys.Enter)
                      {
                          return;
                      }

                      QuerySubmitted?.Invoke(
                          this,
                          searchBox.Text);

                      searchBox.Clear();

                      e.Handled = true;
                      e.SuppressKeyPress = true;
                  }
              }
          }
          '@ | Set-Content `
              -Encoding UTF8 `
              "EverythingSearchBox\SearchBoxToolbarControl.cs"

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: |
          msbuild EverythingSearchBox.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /verbosity:minimal

      - name: Upload EverythingSearchBox.dll
        uses: actions/upload-artifact@v4
        with:
          name: EverythingSearchBox-no-icon
          path: EverythingSearchBox\bin\Release\EverythingSearchBox.dll
          if-no-files-found: error
